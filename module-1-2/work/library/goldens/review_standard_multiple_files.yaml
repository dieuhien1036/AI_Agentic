id: review_standard_multiple_files
prompt: code-review-standard
description: >
  A three-file change whose worst problem is in the file a reviewer is least
  likely to read: an already-applied migration edited in place. Guards against
  a reviewer that only reviews the Python it recognises.
schema: ../validate/review.schema.json
input: |
  diff --git a/migrations/0001_initial.sql b/migrations/0001_initial.sql
  index 1111111..2222222 100644
  --- a/migrations/0001_initial.sql
  +++ b/migrations/0001_initial.sql
  @@ -25,6 +25,7 @@ CREATE TABLE IF NOT EXISTS orders (
       items           JSONB NOT NULL,
       status          VARCHAR(16) NOT NULL DEFAULT 'pending',
       total           NUMERIC(12, 2) NOT NULL CHECK (total >= 0),
  +    note            TEXT,
       created_at      TIMESTAMPTZ NOT NULL DEFAULT now()
   );
  diff --git a/app/orders/routes.py b/app/orders/routes.py
  index 3333333..4444444 100644
  --- a/app/orders/routes.py
  +++ b/app/orders/routes.py
  @@ -48,3 +48,14 @@ async def list_orders(user_id: int,
       rows = await list_orders_for_user(session, user_id=user_id)
       return [_row_to_order(r) for r in rows]
  +
  +
  +class OrderNote(BaseModel):
  +    order_id: int
  +    note: str
  +
  +
  +@router.get("/{order_id}/note")
  +async def get_order_note(order_id: int,
  +                         session: AsyncSession = Depends(get_session)):
  +    row = await get_order_row(session, order_id=order_id)
  +    return OrderNote(order_id=row.id, note=row.note)
  diff --git a/tests/integration/test_orders.py b/tests/integration/test_orders.py
  index 5555555..6666666 100644
  --- a/tests/integration/test_orders.py
  +++ b/tests/integration/test_orders.py
  @@ -40,3 +40,12 @@ async def test_list_orders_filters_by_user(client: AsyncClient) -> None:
       assert isinstance(resp.json(), list)
  +
  +
  +@pytest.mark.asyncio
  +async def test_get_order_note(client: AsyncClient) -> None:
  +    resp = await client.get("/orders/1/note")
  +    assert resp.status_code == 200
  +    assert resp.json() == {"order_id": 1, "note": "gift wrap", "created_at": "2024-01-01T00:00:00Z"}
expected_substrings:
  - "migrations/0001_initial.sql"
  - "app/types.py"
forbidden_substrings:
  - "```"
json_checks:
  issues_count_at_least: 3
  severities_include: ["blocker"]
  issue_must_match:
    - file: "migrations/0001_initial.sql"
      severity: "blocker"
      message_contains: "already applied"
      suggestion_contains: "0002"
    - file: "app/orders/routes.py"
      message_contains: "response_model"
prompt_must_contain:
  - "ONLY a single JSON object"
  - "append-only"
  - "app/types.py"
  - "response_model"
